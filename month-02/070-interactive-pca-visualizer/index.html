<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive PCA Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- ml-matrix for matrix operations (dependency for ml-pca) -->
    <script src="https://cdn.jsdelivr.net/npm/ml-matrix@6.9.0/dist/matrix.min.js"></script>
    <!-- ml-pca for PCA algorithm -->
    <script src="https://cdn.jsdelivr.net/npm/ml-pca@4.0.0/dist/pca.min.js"></script>
    <!-- Chart.js for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.0/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Interactive PCA Visualizer</h1>

        <div class="card file-upload-section">
            <h2>1. Upload Your Data (CSV)</h2>
            <input type="file" id="csvFileInput" accept=".csv">
            <p id="fileNameDisplay" class="file-name"></p>
            <div id="dataPreview" class="data-preview"></div>
        </div>

        <div class="card pca-controls-section">
            <h2>2. PCA Controls</h2>
            <div class="control-group">
                <label for="numComponents">Number of Principal Components to Extract:</label>
                <input type="number" id="numComponents" value="2" min="1">
            </div>
            <div class="control-group">
                <label for="xAxisComponent">X-Axis Component:</label>
                <select id="xAxisComponent"></select>
            </div>
            <div class="control-group">
                <label for="yAxisComponent">Y-Axis Component:</label>
                <select id="yAxisComponent"></select>
            </div>
            <button id="runPcaBtn">Run PCA & Visualize</button>
        </div>

        <div class="card visualization-section">
            <h2>3. PCA Visualization</h2>
            <canvas id="pcaChart"></canvas>
            <div class="info-box">
                <p>Explained Variance Ratio:</p>
                <ul id="explainedVariance"></ul>
            </div>
            <div class="loading-spinner" id="loadingSpinner"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

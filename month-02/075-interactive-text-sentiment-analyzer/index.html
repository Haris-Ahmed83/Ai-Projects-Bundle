<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Sentiment Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Text Sentiment Analyzer</h1>
        <p>Enter text below to get an instant sentiment analysis.</p>
        <textarea id="textInput" placeholder="Type or paste your text here..." rows="10"></textarea>
        <button id="analyzeBtn">Analyze Sentiment</button>
        <div id="result">
            Sentiment: <span class="initial">N/A</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

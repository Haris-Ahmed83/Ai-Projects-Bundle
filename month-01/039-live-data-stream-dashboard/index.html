<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data Stream Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Live Data Stream Dashboard</h1>
            <div class="controls">
                <button id="pausePlayBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <div class="card" data-stream-id="cpu">
                <h2>CPU Usage</h2>
                <div class="value-display">
                    <span class="value">0.0</span><span class="unit">%</span>
                </div>
                <div class="trend-sparkline"></div>
            </div>

            <div class="card" data-stream-id="memory">
                <h2>Memory Usage</h2>
                <div class="value-display">
                    <span class="value">0.0</span><span class="unit">%</span>
                </div>
                <div class="trend-sparkline"></div>
            </div>

            <div class="card" data-stream-id="network">
                <h2>Network Latency</h2>
                <div class="value-display">
                    <span class="value">0</span><span class="unit">ms</span>
                </div>
                <div class="trend-sparkline"></div>
            </div>

            <div class="card" data-stream-id="diskio">
                <h2>Disk I/O</h2>
                <div class="value-display">
                    <span class="value">0.0</span><span class="unit">MB/s</span>
                </div>
                <div class="trend-sparkline"></div>
            </div>
        </main>

        <footer class="dashboard-footer">
            <p>&copy; 2023 Simulated Live Data</p>
        </footer>
    </div>

    <script src="script.js" defer></script>
</body>
</html>

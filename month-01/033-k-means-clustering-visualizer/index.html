<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Means Clustering Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>K-Means Clustering Visualizer</h1>
        <div class="controls">
            <div class="control-group">
                <label for="numPoints">Data Points:</label>
                <input type="number" id="numPoints" value="150" min="10" max="500">
            </div>
            <div class="control-group">
                <label for="numClusters">Clusters (K):</label>
                <input type="number" id="numClusters" value="3" min="2" max="10">
            </div>
            <button id="generateBtn">Generate Data</button>
            <button id="runBtn">Run K-Means</button>
            <button id="resetBtn">Reset</button>
        </div>
        <div class="visualization-area">
            <canvas id="kmeansCanvas" width="800" height="600"></canvas>
            <div id="status">Status: Ready</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

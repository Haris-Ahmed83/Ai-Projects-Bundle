<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Code Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Creative Code Playground</h1>
        <div class="controls">
            <label for="numShapes">Number of Shapes:</label>
            <input type="range" id="numShapes" min="10" max="200" value="50">
            <span id="numShapesValue">50</span>

            <label for="speed">Animation Speed:</label>
            <input type="range" id="speed" min="0.01" max="0.2" step="0.01" value="0.05">
            <span id="speedValue">0.05</span>

            <label for="colorShift">Color Shift Speed:</label>
            <input type="range" id="colorShift" min="0" max="0.1" step="0.001" value="0.01">
            <span id="colorShiftValue">0.01</span>
        </div>
        <canvas id="artCanvas"></canvas>
    </div>
    <script src="script.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Keyword & Co-occurrence Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Text Keyword & Co-occurrence Analyzer</h1>

        <div class="input-section">
            <textarea id="textInput" placeholder="Paste your text here..." rows="15"></textarea>
            <button id="analyzeButton">Analyze Text</button>
        </div>

        <div class="results-section">
            <div class="keywords-panel">
                <h2>Top Keywords</h2>
                <ul id="keywordsList">
                    <!-- Keywords will be displayed here -->
                </ul>
            </div>

            <div class="cooccurrence-panel">
                <h2>Co-occurring Words</h2>
                <div id="cooccurrenceResults">
                    <!-- Co-occurrence results will be displayed here -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

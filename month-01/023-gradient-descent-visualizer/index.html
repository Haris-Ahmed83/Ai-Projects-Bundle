<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Descent Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gradient Descent Visualizer</h1>
        <div class="controls">
            <div class="param-group">
                <label for="learningRate">Learning Rate:</label>
                <input type="number" id="learningRate" value="0.1" step="0.01" min="0.001" max="1">
            </div>
            <div class="param-group">
                <label for="startX">Starting X:</label>
                <input type="number" id="startX" value="-7" step="0.1">
            </div>
            <div class="buttons">
                <button id="startButton">Start</button>
                <button id="resetButton">Reset</button>
            </div>
        </div>
        <div class="visualization">
            <canvas id="gdCanvas" width="600" height="400"></canvas>
            <div class="info">
                <p>Current X: <span id="currentXDisplay"></span></p>
                <p>Current Y: <span id="currentYDisplay"></span></p>
                <p>Iterations: <span id="iterationDisplay"></span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

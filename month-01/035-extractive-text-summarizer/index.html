<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractive Text Summarizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Extractive Text Summarizer</h1>
        <p>Paste or type text below to get a summarized version focusing on the most important sentences.</p>

        <textarea id="textInput" placeholder="Enter your text here..." rows="15"></textarea>

        <button id="summarizeBtn">Summarize Text</button>

        <div class="summary-output">
            <h2>Summary</h2>
            <p id="summaryOutput">Your summary will appear here.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

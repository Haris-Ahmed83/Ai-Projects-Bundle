<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Frequency & Cloud Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Word Frequency & Cloud Generator</h1>
        <div class="input-section">
            <textarea id="textInput" placeholder="Paste your text here..." rows="10"></textarea>
            <button id="analyzeBtn">Analyze Text</button>
        </div>
        <div class="results-section">
            <h2>Word Frequencies & Cloud</h2>
            <div id="wordCloud" class="word-cloud">
                <!-- Word cloud/list will be generated here by JavaScript -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

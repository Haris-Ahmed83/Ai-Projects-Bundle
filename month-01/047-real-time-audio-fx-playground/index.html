<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Audio FX Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Audio FX Playground</h1>

        <div class="input-controls">
            <div class="input-group">
                <label for="audioFile">Upload Audio File:</label>
                <input type="file" id="audioFile" accept="audio/*">
            </div>
            <button id="micInputBtn" class="btn">Use Microphone</button>
        </div>

        <div class="playback-controls">
            <button id="playPauseBtn" class="btn" disabled>Play</button>
            <button id="stopBtn" class="btn" disabled>Stop</button>
            <div class="slider-group">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" min="0" max="1" value="0.75" step="0.01">
            </div>
        </div>

        <div class="fx-controls">
            <h2>Audio Effects</h2>
            <div class="fx-group">
                <label for="filterType">Filter Type:</label>
                <select id="filterType">
                    <option value="lowpass" selected>Lowpass</option>
                    <option value="highpass">Highpass</option>
                    <option value="bandpass">Bandpass</option>
                </select>
            </div>
            <div class="fx-group">
                <label for="filterFrequency">Frequency:</label>
                <input type="range" id="filterFrequency" min="20" max="20000" value="20000" step="10">
                <span id="filterFrequencyValue">20000 Hz</span>
            </div>
            <div class="fx-group">
                <label for="filterQ">Q:</label>
                <input type="range" id="filterQ" min="0.1" max="10" value="1" step="0.1">
                <span id="filterQValue">1</span>
            </div>
        </div>

        <div class="visualization">
            <h2>Visualization</h2>
            <canvas id="audioVisualizer" width="800" height="200"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

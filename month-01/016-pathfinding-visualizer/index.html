<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinding Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pathfinding Visualizer</h1>
        <div class="controls">
            <div class="algorithm-selector">
                <label for="algorithm">Algorithm:</label>
                <select id="algorithm">
                    <option value="dijkstra">Dijkstra's Algorithm</option>
                    <option value="astar">A* Search</option>
                </select>
            </div>
            <div class="mode-buttons">
                <button id="drawObstaclesBtn" class="active">Draw Obstacles</button>
                <button id="setStartBtn">Set Start</button>
                <button id="setEndBtn">Set End</button>
            </div>
            <div class="action-buttons">
                <button id="visualizeBtn">Visualize Algorithm</button>
                <button id="clearGridBtn">Clear Grid</button>
            </div>
        </div>
        <div class="grid-container">
            <canvas id="pathfindingCanvas"></canvas>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="legend-color empty"></span>Empty</div>
            <div class="legend-item"><span class="legend-color start"></span>Start Node</div>
            <div class="legend-item"><span class="legend-color end"></span>End Node</div>
            <div class="legend-item"><span class="legend-color obstacle"></span>Obstacle</div>
            <div class="legend-item"><span class="legend-color visited"></span>Visited Node</div>
            <div class="legend-item"><span class="legend-color path"></span>Shortest Path</div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>

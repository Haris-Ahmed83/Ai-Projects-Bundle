<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Anomaly Detection Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Anomaly Detection Visualizer</h1>

        <div class="input-section">
            <label for="dataInput">Enter data (numbers separated by commas or spaces):</label>
            <textarea id="dataInput" rows="5" placeholder="e.g., 10, 12, 11, 100, 13, 14, 15, 120, 16, 17, 18, 19, 20"></textarea>

            <label for="thresholdInput">Anomaly Threshold (Standard Deviations):</label>
            <input type="number" id="thresholdInput" value="2.5" step="0.1">

            <button id="detectButton">Detect Anomalies</button>
        </div>

        <div class="results-section">
            <h2>Results</h2>
            <div id="anomalyResults">No anomalies detected yet.</div>
        </div>

        <div class="visualization-section">
            <h2>Visualization</h2>
            <canvas id="dataChart" width="800" height="400"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Automata Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cellular Automata Simulator</h1>
        <div class="controls">
            <button id="playPauseBtn">Start</button>
            <button id="resetBtn">Reset</button>
            <button id="randomizeBtn">Randomize</button>
            <button id="clearBtn">Clear Grid</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <p class="info">Click on the grid to toggle cells. Currently simulating Conway's Game of Life.</p>
    </div>
    <script src="script.js" defer></script>
</body>
</html>

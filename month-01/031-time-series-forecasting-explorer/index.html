<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Series Forecasting Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Time Series Forecasting Explorer</h1>
        </header>

        <main>
            <section class="input-section card">
                <h2>1. Input Data</h2>
                <textarea id="dataInput" placeholder="Enter time series data (one value per line)" rows="10"></textarea>
                <div class="input-actions">
                    <button id="loadDataBtn">Load Data</button>
                    <button id="loadExampleBtn">Load Example Data</button>
                </div>
            </section>

            <section class="controls-section card">
                <h2>2. Apply Forecasting</h2>
                <div class="control-group">
                    <label for="methodSelect">Method:</label>
                    <select id="methodSelect">
                        <option value="none">None</option>
                        <option value="movingAverage">Moving Average</option>
                        <option value="exponentialSmoothing">Exponential Smoothing</option>
                    </select>
                </div>
                <div class="control-group" id="maParams">
                    <label for="maWindow">Window Size (MA):</label>
                    <input type="number" id="maWindow" value="3" min="1">
                </div>
                <div class="control-group" id="esParams" style="display: none;">
                    <label for="esAlpha">Alpha (ES, 0-1):</label>
                    <input type="number" id="esAlpha" value="0.2" min="0" max="1" step="0.01">
                </div>
                <button id="applyForecastBtn">Apply Forecast</button>
                <button id="clearForecastBtn">Clear Forecast</button>
            </section>

            <section class="visualization-section card">
                <h2>3. Visualization</h2>
                <div class="chart-container">
                    <canvas id="timeSeriesChart"></canvas>
                </div>
                <div class="legend">
                    <span class="legend-item original-data">Original Data</span>
                    <span class="legend-item forecast-data">Forecast</span>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js" defer></script>
</body>
</html>

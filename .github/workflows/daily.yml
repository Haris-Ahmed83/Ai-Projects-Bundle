name: Daily AI Projects Generator

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate daily projects
        id: generate
        continue-on-error: true
        env:
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECTS_PER_RUN: ${{ github.event.inputs.count || '2' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/generate.py

      - name: Commit and push
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "Haris-Ahmed83"
          git config user.email "hariscool987@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(daily): $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify failure
        if: steps.generate.outcome == 'failure'
        run: echo "::error::Generation failed"

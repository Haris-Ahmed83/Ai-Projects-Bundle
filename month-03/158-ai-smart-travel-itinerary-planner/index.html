<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Travel Itinerary Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Smart Travel Itinerary Planner</h1>
        <p>Input your preferences and let our AI craft your perfect trip!</p>

        <div class="input-section">
            <div class="input-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" placeholder="e.g., Paris, Tokyo" value="Kyoto">
            </div>
            <div class="input-group">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" value="2024-09-15">
            </div>
            <div class="input-group">
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" value="2024-09-20">
            </div>
            <div class="input-group">
                <label for="interests">Interests (comma-separated):</label>
                <input type="text" id="interests" placeholder="e.g., history, food, nature" value="temples, gardens, food">
            </div>
            <div class="input-group">
                <label for="budget">Budget (per day, USD):</label>
                <input type="number" id="budget" placeholder="e.g., 100, 250" value="150">
            </div>
            <button id="generateBtn">Generate Itinerary</button>
        </div>

        <div class="itinerary-output">
            <h2>Your Personalized Itinerary</h2>
            <div id="itineraryContent">
                <p>Enter your details and click "Generate Itinerary" to see your personalized plan!</p>
            </div>
            <div id="loading" class="hidden">Generating your perfect trip...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

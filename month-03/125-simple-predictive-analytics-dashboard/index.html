<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Predictive Analytics Dashboard</h1>
            <p>Upload your dataset (CSV) to visualize trends and predict future outcomes.</p>
        </header>

        <section class="data-upload-section card">
            <h2>1. Upload Data</h2>
            <div class="input-group">
                <label for="csvFile">Choose CSV File:</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            <button id="loadDataBtn" disabled>Load & Preview Data</button>
            <div id="dataPreview" class="data-preview"></div>
        </section>

        <section class="model-config-section card">
            <h2>2. Configure Model</h2>
            <div class="input-group">
                <label for="featureColumn">Feature Column (X):</label>
                <select id="featureColumn" disabled></select>
            </div>
            <div class="input-group">
                <label for="targetColumn">Target Column (Y):</label>
                <select id="targetColumn" disabled></select>
            </div>
            <div class="input-group">
                <label for="predictionSteps">Prediction Steps:</label>
                <input type="number" id="predictionSteps" value="5" min="1" disabled>
            </div>
            <button id="trainPredictBtn" disabled>Train Model & Predict</button>
        </section>

        <section class="visualization-section card">
            <h2>3. Visualization</h2>
            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>
            <div id="predictionOutput" class="prediction-output"></div>
        </section>
    </div>

    <script src="script.js" defer></script>
</body>
</html>

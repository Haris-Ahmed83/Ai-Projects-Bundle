<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creative Idea Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Creative Idea Generator</h1>
        <p class="description">Unlock your creativity! Input a topic, and our AI will generate novel ideas and concepts to help you overcome creative blocks.</p>

        <div class="input-section">
            <label for="topicInput">Enter your topic or problem statement:</label>
            <textarea id="topicInput" rows="5" placeholder="e.g., 'sustainable urban transport', 'engaging online learning', 'futuristic kitchen gadgets'"></textarea>
            <button id="generateIdeasBtn">Generate Ideas</button>
        </div>

        <div class="results-section">
            <h2>Generated Ideas</h2>
            <div id="ideaOutput" class="idea-output">
                <p class="placeholder-text">Ideas will appear here...</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Health Optimizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Recipe Health Optimizer</h1>
        <p>Input your recipe, and our AI will analyze its nutritional content and suggest healthier substitutions or preparation methods.</p>

        <div class="input-section">
            <label for="recipeInput">Enter your recipe here:</label>
            <textarea id="recipeInput" placeholder="e.g., 2 tbsp butter, 1 cup sugar, 2 eggs, 1 cup white flour, 1/2 tsp salt, 1 cup milk, 1 cup broccoli."></textarea>
            <button id="analyzeBtn">Analyze & Optimize Recipe</button>
        </div>

        <div id="results" class="results-section" style="display: none;">
            <h2>Original Nutritional Analysis</h2>
            <pre id="originalAnalysis"></pre>

            <h2>Optimized Recipe Suggestions</h2>
            <pre id="optimizedRecipe"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

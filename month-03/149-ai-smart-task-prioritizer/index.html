<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Task Prioritizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Smart Task Prioritizer</h1>

        <div class="task-input-section">
            <input type="text" id="newTaskInput" placeholder="Enter a new task...">
            <button id="addTaskBtn">Add Task (AI Prioritize)</button>
        </div>

        <div class="task-list-section">
            <h2>Your Prioritized Tasks</h2>
            <div id="taskList" class="task-list">
                <!-- Tasks will be rendered here by script.js -->
            </div>
        </div>

        <div class="ai-insights-section">
            <h2>AI Productivity Insights</h2>
            <p id="aiInsight"></p>
            <button id="getInsightBtn">Get New Insight</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>

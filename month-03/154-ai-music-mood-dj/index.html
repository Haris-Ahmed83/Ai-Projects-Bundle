<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Mood DJ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Music Mood DJ</h1>
        <p>Tell me your current mood or activity, and I'll create a personalized playlist!</p>
        <textarea id="moodInput" placeholder="Feeling energetic and ready to dance!" rows="4"></textarea>
        <button id="generatePlaylistBtn">Generate Playlist</button>
        <div id="playlistOutput" class="playlist-output">
            <h2>Your Personalized Playlist:</h2>
            <ul id="playlistItems">
                <!-- Playlist items will be inserted here by JavaScript -->
            </ul>
            <p id="noPlaylistMessage">Enter your mood and click 'Generate' to get started!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

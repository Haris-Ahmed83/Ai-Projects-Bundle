<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personalized Learning Path</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Personalized Learning Path</h1>
            <p>Your intelligent companion for mastering any topic.</p>
        </header>

        <section class="input-section">
            <p>Enter a topic or skill you want to learn:</p>
            <div class="input-group">
                <input type="text" id="topicInput" placeholder="e.g., React, Machine Learning, Web Development">
                <button id="generatePathBtn">Generate Path</button>
            </div>
        </section>

        <section id="learningPath" class="learning-path">
            <h2>Your Customized Learning Path</h2>
            <div id="pathContent" class="path-content">
                <p class="placeholder">Enter a topic and click "Generate Path" to see your personalized learning journey!</p>
            </div>
        </section>
    </div>

    <script src="script.js" defer></script>
</body>
</html>

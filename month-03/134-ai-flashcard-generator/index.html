<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Flashcard Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Flashcard Generator</h1>
        <p>Input your notes or text below, and AI will generate interactive flashcards for you.</p>
        
        <textarea id="inputText" placeholder="Paste your lecture notes, article text, or any content here..." rows="15"></textarea>
        <button id="generateBtn">Generate Flashcards</button>
        
        <div id="flashcardContainer">
            <!-- Flashcards will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>

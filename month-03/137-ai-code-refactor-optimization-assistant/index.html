<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Refactor & Optimization Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Code Refactor & Optimization Assistant</h1>
        <p>Paste your code below to get AI-powered refactoring and optimization suggestions.</p>

        <div class="input-section">
            <textarea id="codeInput" placeholder="Paste your JavaScript code here..."></textarea>
            <button id="refactorBtn">Refactor & Optimize Code</button>
        </div>

        <div class="output-section">
            <h2>Refactored & Optimized Code:</h2>
            <pre id="outputCode" class="code-output"><code>// Your refactored code will appear here.</code></pre>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

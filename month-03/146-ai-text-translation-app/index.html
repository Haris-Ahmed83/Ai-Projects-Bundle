<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Translation App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Text Translation</h1>

        <div class="language-selection">
            <div class="lang-group">
                <label for="sourceLang">Source Language:</label>
                <select id="sourceLang"></select>
            </div>
            <div class="lang-group">
                <label for="targetLang">Target Language:</label>
                <select id="targetLang"></select>
            </div>
        </div>

        <div class="text-areas">
            <textarea id="inputText" placeholder="Enter text to translate..." rows="8"></textarea>
            <textarea id="outputText" placeholder="Translated text will appear here..." rows="8" readonly></textarea>
        </div>
        
        <button id="translateBtn">Translate</button>
    </div>

    <script src="script.js" defer></script>
</body>
</html>

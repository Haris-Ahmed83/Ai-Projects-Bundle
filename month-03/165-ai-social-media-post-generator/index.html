<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Social Media Post Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' font-size='80' text-anchor='middle' dominant-baseline='central'%3E🤖%3C/text%3E%3C/svg%3E" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Social Media Post Generator</h1>
            <p>Craft engaging posts for any topic, audience, and tone. Get ready to boost your content game!</p>
        </header>

        <main>
            <form id="post-generator-form">
                <div class="form-group">
                    <label for="topic">Topic:</label>
                    <textarea id="topic" placeholder="e.g., benefits of remote work, eco-friendly living tips, mastering productivity" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="audience">Target Audience:</label>
                    <input type="text" id="audience" placeholder="e.g., small business owners, young adults, new parents" required>
                </div>
                <div class="form-group">
                    <label for="tone">Desired Tone:</label>
                    <select id="tone" required>
                        <option value="Professional">Professional</option>
                        <option value="Casual">Casual</option>
                        <option value="Humorous">Humorous</option>
                        <option value="Inspirational">Inspirational</option>
                        <option value="Educational">Educational</option>
                    </select>
                </div>
                <button type="submit" id="generate-button">Generate Posts</button>
            </form>

            <div id="loading-indicator" class="hidden">
                <div class="spinner"></div>
                <p>Generating amazing posts...</p>
            </div>

            <section id="results-section" class="hidden">
                <h2>Generated Post Options</h2>
                <div id="post-options-container">
                    <!-- Post cards will be injected here -->
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2023 AI Post Generator. All rights reserved.</p>
        </footer>
    </div>
    <script src="script.js" defer></script>
</body>
</html>

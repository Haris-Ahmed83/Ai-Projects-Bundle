<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Explainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Code Explainer</h1>
        <p>Paste your code below and let AI generate comments, explanations, or basic documentation.</p>
        
        <textarea id="code-input" placeholder="Paste your code here..."></textarea>
        
        <button id="explain-button">Explain Code</button>
        
        <div id="explanation-output" class="output-box">
            <p>Your AI-generated explanation will appear here.</p>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
